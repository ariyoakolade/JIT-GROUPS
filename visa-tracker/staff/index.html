<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Visa Application Tracker | JIT Travels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../portal.css">
</head>
<body>
  <header class="header"><img class="logo" src="../../image/Company%27s%20logo.png" alt=""><div class="brand">JIT TRAVELS<small>VISA APPLICATION TRACKER</small></div><button class="button outline" data-sign-out>Sign out</button></header>
  <main>
    <div class="heading-row"><div><p class="eyebrow">Staff portal</p><h1>Visa applications</h1><p class="muted" data-staff-name></p></div><button class="button gold" data-add>Register client</button></div>
    <p class="notice" data-setup hidden></p>
    <p class="notice" data-message role="status" aria-live="polite" hidden></p>
    <div class="tabs" aria-label="Tracker sections">
      <button class="tab active" data-tab="applications">Applications</button>
      <button class="tab" data-tab="timeline">Timeline</button>
      <button class="tab" data-tab="reports">Reports</button>
      <button class="tab" data-tab="staff">Staff</button>
      <button class="tab" data-tab="activity">Activity log</button>
    </div>
    <section data-panel="applications">
      <div class="toolbar"><input data-search type="search" placeholder="Search name or reference" aria-label="Search clients"><button class="button outline" data-refresh>Refresh</button></div>
      <div class="card" data-list><p class="muted">Loading applications…</p></div>
    </section>
    <section data-panel="timeline" hidden><div class="card" data-timeline></div></section>
    <section data-panel="reports" hidden><div class="card" data-reports></div></section>
    <section data-panel="staff" hidden><div class="card" data-staff></div></section>
    <section data-panel="activity" hidden><div class="card" data-activity></div></section>
    <p class="footer">Do not upload passports, bank statements or other sensitive documents here.</p>
  </main>
  <dialog class="modal" data-dialog>
    <form class="modal-inner" data-client-form>
      <p class="eyebrow">New application</p><h2>Register a client</h2>
      <div class="form-grid">
        <label>Full name<input name="full_name" maxlength="120" required></label>
        <label>Email address<input name="email" type="email" maxlength="160" required></label>
        <label>Phone number<input name="phone" type="tel" maxlength="40" required></label>
        <label>Destination<input name="destination" value="United Kingdom" maxlength="80" required></label>
        <label>Visa category<input name="visa_category" value="UK Standard Visitor Visa" maxlength="100" required></label>
        <label>Date registered<input name="registered_at" type="date" required></label>
      </div>
      <p class="notice" data-form-message hidden></p>
      <button class="button primary" type="submit">Save and send welcome email</button>
      <button class="button outline" type="button" data-close>Cancel</button>
    </form>
  </dialog>
  <script src="../supabase-config.js"></script>
  <script type="module" src="../staff.js"></script>
</body>
</html>
