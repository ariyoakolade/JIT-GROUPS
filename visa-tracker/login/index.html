<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Staff sign in | JIT Travels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../portal.css">
</head>
<body>
  <header class="header"><img class="logo" src="../../image/Company%27s%20logo.png" alt=""><div class="brand">JIT TRAVELS<small>STAFF PORTAL</small></div></header>
  <main>
    <section class="card">
      <p class="eyebrow">Private staff access</p><h1 data-login-title>Sign in</h1>
      <p class="muted">Staff are invited by an administrator and set their own password. Public staff registration is disabled.</p>
      <p class="notice" data-setup hidden></p>
      <form data-login>
        <label>Email address<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">Sign in</button>
      </form>
      <form data-change-password hidden>
        <label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
        <label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label>
        <button class="button primary" type="submit">Save password</button>
      </form>
      <button class="text-button" type="button" data-reset>Forgot password?</button>
      <p class="notice" data-message role="status" aria-live="polite" hidden></p>
      <p><a href="../../index.html">Return to JIT Group website</a></p>
    </section>
  </main>
  <script src="../supabase-config.js"></script>
  <script type="module" src="../login.js"></script>
</body>
</html>
