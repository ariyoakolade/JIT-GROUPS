<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#102B33" />
    <title>Staff Visa Tracker | JIT Travels</title>
    <link rel="icon" type="image/png" href="image/Company%27s%20logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #17272b; background: #f5f7f6; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      .card { width: min(520px, 100%); padding: 38px; border: 1px solid #e0e7e5; border-radius: 12px; background: #fff; box-shadow: 0 16px 40px #102b3318; text-align: center; }
      img { display: block; width: 76px; height: 76px; object-fit: contain; margin: 0 auto 20px; }
      .label { display: block; color: #866718; text-transform: uppercase; letter-spacing: .15em; font-size: .75rem; font-weight: 700; }
      h1 { margin: 8px 0 12px; color: #102b33; font-size: clamp(1.7rem, 5vw, 2.2rem); }
      p { color: #647276; line-height: 1.65; }
      .button { display: inline-block; margin: 12px 6px 0; padding: 13px 20px; border-radius: 6px; background: #c69a2b; color: #171b1b; font-weight: 700; text-decoration: none; }
      .button.secondary { background: #e8efed; color: #102b33; }
      .home { display: block; width: fit-content; margin: 22px auto 0; color: #102b33; font-size: .86rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="image/Company%27s%20logo.png" alt="JIT Group of Companies" />
      <span class="label">JIT Travels · Secure application portal</span>
      <h1>Visa Application Tracker</h1>
      <p>Staff can manage applications with their JIT account. Clients can securely view progress using their email link.</p>
      <a class="button" href="/visa-tracker/login/">Staff sign in</a>
      <a class="button secondary" href="/visa-tracker/portal/">Client progress</a>
      <a class="home" href="index.html">Return to the JIT Group website</a>
    </main>
  </body>
</html>
